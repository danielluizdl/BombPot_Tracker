<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BombPot Tracker</title>
<link rel="icon" href="data:,">
<style>
/* Tema escuro no padrão do SnapMDA: fundo quase preto, cartões, controles segmentados e um destaque lima. */
:root {
  --bg: #111317; --card: #191c22; --card-2: #20242c; --line: #2c313b; --line-2: #3a404c;
  --text: #e7e9ee; --muted: #8b93a1; --dim: #5d6573; --accent: #d4f53c; --accent-ink: #151a05;
  --x: #6f7888; --b: #e8a33d; --c: #3aa0f0; --r: #e05555; --f: #a78bfa;
  --bom: #4cc38a; --ruim: #e05555; --neutro: #e8c547;
}
* { box-sizing: border-box; }
html { scrollbar-color: #3a404c var(--bg); }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 "Segoe UI", system-ui, sans-serif; }
::selection { background: var(--accent); color: var(--accent-ink); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button, input, select { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }

/* --- topo --- */
header { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; padding: 10px 18px; border-bottom: 1px solid var(--line); }
.logo { font-weight: 700; letter-spacing: .4px; font-size: 15px; }
.logo b { color: var(--accent); }
header .info { color: var(--muted); }
.abas { display: flex; gap: 2px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.abas button { border: 0; background: none; padding: 6px 14px; border-radius: 6px; cursor: pointer; color: var(--muted); }
.abas button[aria-selected="true"] { background: var(--card-2); color: var(--text); }
header .direita { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
select, .btn { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; min-height: 34px; }
.btn { cursor: pointer; } .btn:hover, select:hover { border-color: var(--line-2); }
.btn.primario { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

[hidden] { display: none !important; }
/* --- barra de comando --- */
#comando { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; padding: 14px 18px; border-bottom: 1px solid var(--line); background: #14161b; }
.grupo-cmd { display: flex; flex-direction: column; gap: 4px; }
.grupo-cmd > span { font-size: 11px; color: var(--muted); padding-left: 2px; }
.seg { display: flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; background: var(--card); }
.seg button { border: 0; border-right: 1px solid var(--line); background: none; padding: 7px 12px; cursor: pointer; min-height: 34px; color: var(--muted); }
.seg button:last-child { border-right: 0; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--card-2); color: var(--accent); font-weight: 600; }
.cmd-linha select { min-width: 150px; }
#comando .fim { margin-left: auto; display: flex; gap: 8px; }
#ativos { display: flex; gap: 6px; flex-wrap: wrap; padding: 10px 18px 0; min-height: 30px; }
.pilula { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line-2); background: var(--card); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 12px; }
.pilula button { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 2px 6px; border-radius: 999px; }
.pilula button:hover { background: var(--card-2); color: var(--text); }
#ativos .vazio { color: var(--muted); font-size: 12px; padding: 4px 0; }

/* --- cartões --- */
main { padding: 12px 18px 48px; display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.card > h2, .card > summary { margin: 0; padding: 12px 16px; font-size: 14px; font-weight: 600; border-bottom: 1px solid var(--line);
  display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.card > summary { cursor: pointer; list-style: none; }
.card > summary::-webkit-details-marker { display: none; }
.card h2 small, .card summary small { color: var(--muted); font-weight: 400; font-size: 12px; }
.card .acoes-card { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.lado-a-lado { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1150px) { .lado-a-lado { grid-template-columns: 1fr; } }
.barra-quadros { display: flex; justify-content: flex-end; }
.controles-card { display: flex; justify-content: flex-end; padding: 10px 16px 0; }
.card > summary .seta { color: var(--muted); transition: transform .15s; display: inline-block; }
.card:not([open]) > summary .seta { transform: rotate(-90deg); }
.card:not([open]) > summary { border-bottom: 0; }
.dividir { color: var(--muted); font-size: 12px; font-weight: 400; display: flex; gap: 6px; align-items: center; }
th .ver { color: var(--text); font-weight: 600; }
.tam small { color: var(--muted); font-size: 11px; }
.linha-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 14px; }
.nota { color: var(--muted); font-size: 12px; padding: 8px 16px 12px; margin: 0; line-height: 1.5; }
.carregando main { opacity: .55; transition: opacity .15s; }

/* --- relatório (grade) --- */
.rolar { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; vertical-align: middle; }
thead th { color: var(--muted); font-weight: 400; font-size: 12px; background: #16191e; }
thead th[title] { cursor: help; text-decoration: underline dotted var(--dim); text-underline-offset: 3px; }
tbody tr:hover { background: #1d2128; }
tr.geral th { color: var(--accent); }
tr.linha-a th { color: var(--c); }
td.fraca, td .fraca { opacity: .45; }
.amostra b { font-size: 14px; } .amostra small { color: var(--muted); display: block; font-size: 11px; }
.pilha { display: flex; height: 18px; width: 240px; border-radius: 4px; overflow: hidden; background: var(--card-2); }
.pilha span { height: 100%; font-size: 11px; line-height: 18px; text-align: center; color: #0e1013; font-weight: 600; overflow: hidden; }
.legenda { display: flex; gap: 10px; flex-wrap: wrap; font-size: 11px; color: var(--muted); margin-top: 4px; }
.legenda i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.weakbar { position: relative; width: 150px; height: 22px; border-radius: 4px; overflow: hidden;
  background: linear-gradient(90deg, #2f9e64 0%, #e8c547 45%, #e8803d 70%, #d64545 100%); }
.weakbar .rot { position: absolute; left: 4px; top: 3px; background: rgba(10,12,14,.82); color: #e7e9ee; font-size: 11px; padding: 0 6px; border-radius: 3px; line-height: 16px; }
.weakbar .marca { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; box-shadow: 0 0 0 1px rgba(0,0,0,.5); }
.resp { display: flex; gap: 14px; }
.resp div { display: flex; flex-direction: column; } .resp small { color: var(--muted); font-size: 10px; }
.resp b { font-size: 13px; }
.bom { color: var(--bom); } .ruim { color: var(--ruim); } .neutro { color: var(--neutro); }
.tam { display: inline-flex; gap: 6px; align-items: baseline; } .tam b { color: var(--b); font-size: 14px; }
.ver { border: 1px solid var(--line); background: none; border-radius: 6px; padding: 4px 10px; cursor: pointer; color: var(--muted); }
.ver:hover { color: var(--text); border-color: var(--line-2); }

/* --- gráfico --- */
.grafico { padding: 10px 16px 4px; }
.grafico svg { width: 100%; max-width: 980px; max-height: 340px; height: auto; display: block; margin: 0 auto; }
.grafico text { fill: var(--muted); font-size: 11px; }
.grafico .eixo { stroke: var(--line); } .grafico .grade { stroke: #23272f; }
.leg-graf { display: flex; gap: 16px; flex-wrap: wrap; padding: 0 16px; font-size: 12px; color: var(--muted); }
.leg-graf i { display: inline-block; width: 14px; height: 3px; margin-right: 6px; vertical-align: 3px; }

/* --- distribuições (força, draws) --- */
.dist td:first-child { width: 40%; }
.barra { height: 8px; border-radius: 4px; background: var(--b); min-width: 2px; }

/* --- mesa --- */
.mesa-controles { display: flex; gap: 12px; justify-content: space-between; align-items: center; flex-wrap: wrap; padding: 12px 16px 0; }
.mesa { position: relative; height: 360px; max-width: 820px; margin: 56px auto 46px; }
.feltro { position: absolute; inset: 46px 80px; border-radius: 160px; border: 9px solid #3d2e1e;
  background: radial-gradient(ellipse at center, #2c6340 0%, #1a432a 75%); display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 2px; text-align: center; }
.feltro strong { font-size: 17px; } .feltro small { color: #b9d3bf; }
.assento { position: absolute; transform: translate(-50%, -50%); width: 124px; padding: 6px 4px; cursor: pointer; border-radius: 8px;
  background: var(--card-2); border: 1px solid var(--line-2); display: flex; flex-direction: column; align-items: center; gap: 1px; }
.assento:hover { border-color: var(--accent); }
.assento.marcado { border: 2px solid var(--accent); background: #262d14; }
.assento b { font-size: 14px; } .assento.marcado b { color: var(--accent); }
.assento .p { font-size: 11px; color: var(--muted); } .assento .a { font-size: 12px; }
.assento.vazio { cursor: default; border-style: dashed; color: var(--dim); background: transparent; padding: 16px 4px; }
.assento.vazio:hover { border-color: var(--line-2); }
.dealer { position: absolute; transform: translate(-50%, -50%); width: 24px; height: 24px; border-radius: 50%;
  background: #f2f2f2; color: #111; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }

/* --- mãos --- */
.maos { max-height: 460px; overflow-y: auto; }
.maos tbody tr { cursor: pointer; }
.linha-mao { white-space: normal; font-size: 12px; color: var(--muted); }
.linha-mao .rua { margin-right: 10px; display: inline-block; }
.linha-mao .eu { color: var(--accent); font-weight: 700; }
.cartas span { margin-right: 3px; font-weight: 700; }
.naipe-s { color: #c8c8c8; } .naipe-h { color: #e05555; } .naipe-d { color: #3aa0f0; } .naipe-c { color: #4cc38a; }

/* --- MDA --- */
.mda-barra { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.mda-barra .caminho { flex: 1 1 320px; } .mda-barra .vazio { color: var(--muted); font-size: 12px; }
.mda-grade { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .mda-grade { grid-template-columns: 1fr; } }
.mda-col h3 { margin: 0 0 8px; font-size: 22px; letter-spacing: .5px; } .mda-col h3 small { color: var(--accent); font-size: 12px; font-weight: 400; }
.mda-no { background: var(--card); border: 1px solid var(--line); border-radius: 8px; margin-bottom: 10px; padding: 6px 8px 8px; }
.mda-no-cab { display: flex; gap: 6px; align-items: baseline; color: var(--bom); font-size: 12px; padding: 2px 2px 6px; }
.mda-no-cab b { color: var(--text); } .mda-no-cab small { margin-left: auto; color: var(--muted); }
.mda-acao { display: grid; grid-template-columns: minmax(80px, 1.2fr) 1fr 48px 46px; gap: 8px; align-items: center; width: 100%;
  background: none; border: 1px solid transparent; border-radius: 6px; padding: 4px 6px; cursor: pointer; text-align: left; }
.mda-acao:hover { background: var(--card-2); }
.mda-acao.ativa { border-color: var(--accent); background: #262d14; }
.mda-acao .rot { font-variant-numeric: tabular-nums; }
.mda-acao b { text-align: right; } .mda-acao small { color: var(--muted); font-size: 11px; }
.barrinha { height: 6px; background: var(--card-2); border-radius: 3px; overflow: hidden; } .barrinha i { display: block; height: 100%; }
.mda-pequenos summary { cursor: pointer; color: var(--muted); font-size: 12px; padding: 4px 2px 8px; }
b.destaque { color: var(--accent); }

/* --- jogadores (cores do gráfico do MetaLens) --- */
:root { --g-net: #4caf7d; --g-sd: #5b9bd5; --g-nsd: #e8564d; --g-ev: #f5c518; --g-jp: #b07fe8; }
.jogadores-grade { display: grid; grid-template-columns: minmax(300px, 470px) minmax(0, 1fr); gap: 14px; align-items: start; }
@media (max-width: 1000px) { .jogadores-grade { grid-template-columns: 1fr; } }
.lista-jogadores { padding: 10px; }
.lista-jogadores input { width: 100%; margin-bottom: 8px; padding: 8px 10px; background: var(--card-2); border: 1px solid var(--line); border-radius: 6px; color: var(--text); }
.lista-jogadores .rolar { max-height: 70vh; overflow: auto; }
.lista-jogadores tr.jogador { cursor: pointer; }
.lista-jogadores tr.jogador:hover { background: var(--card-2); }
.lista-jogadores tr.jogador.ativo { background: #262d14; }
.lista-jogadores tr.jogador.ativo th { color: var(--accent); }
.lista-jogadores table { width: 100%; font-size: 13px; } .lista-jogadores td, .lista-jogadores th { padding: 7px 6px; }
.lista-jogadores th { text-align: left; font-weight: 500; max-width: 140px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grafico-jogador { position: relative; padding: 12px 14px; }
.cab-jogador { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.cab-jogador h2 { margin: 0 8px 0 0; font-size: 20px; }
.legenda { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.legenda button { display: flex; align-items: center; gap: 7px; min-height: 34px; padding: 5px 12px; background: var(--card-2);
  border: 1px solid var(--line); border-radius: 999px; color: var(--text); font-size: 13px; cursor: pointer; }
.legenda button[aria-pressed="false"] { color: var(--dim); }
.legenda button[aria-pressed="false"] i { opacity: .25; }
.legenda i { width: 14px; height: 3px; border-radius: 2px; }
.legenda small { color: var(--muted); }
.grafico-jogador svg { width: 100%; display: block; }
.grafico-jogador svg text { fill: var(--muted); font-size: 11px; }
.grafico-jogador .grade { stroke: var(--line); stroke-width: 1; }
.grafico-jogador .zero { stroke: var(--muted); stroke-width: 1; }
.grafico-jogador .cursor { stroke: var(--muted); stroke-dasharray: 3 3; }
.dica { position: absolute; pointer-events: none; background: var(--card-2); border: 1px solid var(--line-2); border-radius: 8px;
  padding: 8px 10px; font-size: 12px; white-space: nowrap; z-index: 3; }
.dica div { display: flex; justify-content: space-between; gap: 14px; }

/* --- painel --- */
.painel-grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 14px; }
tr.clicavel { cursor: pointer; }

/* --- gaveta de filtros --- */
#fundo { position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 9; }
#avancado { position: fixed; top: 0; right: 0; bottom: 0; width: min(440px, 100vw); background: #15181d; border-left: 1px solid var(--line);
  z-index: 10; overflow-y: auto; transform: translateX(100%); transition: transform .15s ease-out; }
#avancado.aberto { transform: none; }
#avancado header { position: sticky; top: 0; background: #15181d; z-index: 1; }
.cartao-f { margin: 12px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.cartao-f h3 { margin: 0 0 4px; font-size: 13px; }
.cartao-f p.ex { margin: 0 0 8px; color: var(--muted); font-size: 12px; }
.filtro { padding: 6px 0; }
.filtro > label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--card-2); padding: 4px 9px; border-radius: 6px; cursor: pointer; min-height: 28px; }
.chip:hover { border-color: var(--line-2); }
.chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: #262d14; }
.faixa-livre { margin-top: 8px; padding: 8px 10px; border: 1px dashed var(--line-2); border-radius: 8px; }
.faixa-livre.ativa { border-style: solid; border-color: var(--accent); }
.faixa-livre-topo { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.faixa-livre-topo b { color: var(--text); }
.faixa-livre-barras { display: grid; grid-template-columns: 28px 1fr 88px; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.faixa-livre-barras input[type=range] { accent-color: var(--accent); width: 100%; }
.faixa-livre-barras input[type=number] { width: 88px; background: var(--card-2); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
.faixa { display: flex; gap: 6px; align-items: center; }
.faixa input { width: 110px; background: var(--card-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 7px; }

dialog { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 0; max-width: min(96vw, 720px); max-height: 94vh; }
dialog::backdrop { background: rgba(0,0,0,.7); }
dialog header { position: sticky; top: 0; background: var(--card); }
dialog img { display: block; width: 100%; height: auto; }
details.explica { padding: 0 16px 12px; color: var(--muted); font-size: 12px; }
details.explica summary { cursor: pointer; color: var(--accent); padding: 4px 0; }
details.explica p { margin: 6px 0; line-height: 1.5; }

@media (max-width: 760px) {
  #comando .fim { margin-left: 0; }
  .mesa { height: 320px; } .feltro { inset: 46px 34px; } .assento { width: 92px; }
  .pilha { width: 160px; }
}
</style>
</head>
<body>
<header>
  <div class="logo">BOMBPOT <b>TRACKER</b></div>
  <span class="info num" id="info">carregando…</span>
  <div class="abas" role="tablist">
    <button role="tab" id="aba-estudo" aria-selected="true">Estudo</button>
    <button role="tab" id="aba-painel" aria-selected="false">Painel de tendências</button>
    <button role="tab" id="aba-mda" aria-selected="false">MDA</button>
    <button role="tab" id="aba-jogadores" aria-selected="false">Jogadores</button>
  </div>
  <div class="direita">
    <select id="presets" aria-label="Filtros prontos"><option value="">Filtros prontos…</option></select>
    <select id="salvos" aria-label="Meus filtros"><option value="">Meus filtros…</option></select>
    <button class="btn" id="salvar">Salvar filtro</button>
    <button class="btn" id="fixarA" title="Guarda o filtro atual como A; a grade mostra A em cima para comparar">Fixar como A</button>
    <button class="btn" id="exportar" title="As mãos do filtro, em .txt para importar no H2N">Exportar .txt</button>
  </div>
</header>
<section id="comando" aria-label="Spot"></section>
<div id="ativos"></div>
<main id="estudo"></main>
<main id="painel" hidden></main>
<main id="mda" hidden></main>
<main id="jogadores" hidden></main>
<div id="fundo" hidden></div>
<aside id="avancado" aria-label="Mais filtros">
  <header><div class="logo">Mais filtros</div><div class="direita"><button class="btn" id="fechar-avancado">Fechar</button></div></header>
  <div id="avancado-corpo"></div>
</aside>
<script type="module" src="app.js"></script>
</body>
</html>
